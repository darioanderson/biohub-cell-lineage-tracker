[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biohub-cell-tracking"
version = "1.8.0"
description = "3D+t cell detection, tracking, and lineage reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-image>=0.21",
  "networkx>=3.1",
  "blosc2>=2.0",
  "zarr>=2.16,<3",
  "numcodecs<0.16",
  "imageio>=2.31",
]

[project.optional-dependencies]
app = ["streamlit>=1.49,<2", "plotly>=6,<8"]
training = ["torch==2.7.1", "tifffile==2025.5.10", "imagecodecs<2025"]
test = ["pytest>=8"]
review = ["cellpose==3.1.1.1", "torch==2.7.1", "opencv-python-headless==4.10.0.84", "numba==0.60.0", "imagecodecs<2025"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
